<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#1f293d"/>
    </linearGradient>
    
    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>

    <radialGradient id="wafer-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    @keyframes pulse {
      0%, 100% { opacity: 0.3; transform: scale(1); }
      50% { opacity: 0.8; transform: scale(1.03); }
    }
    @keyframes flowLine {
      0% { stroke-dashoffset: 100; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes rotateWafer {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes floatNode {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }
    .wafer-ring { animation: pulse 4s infinite ease-in-out; transform-origin: 1000px 200px; }
    .wafer-grid { animation: rotateWafer 40s linear infinite; transform-origin: 1000px 200px; }
    .trace-line { stroke-dasharray: 10 15; animation: flowLine 3s linear infinite; }
    .node-1 { animation: floatNode 3.5s ease-in-out infinite; }
    .node-2 { animation: floatNode 4.2s ease-in-out infinite 0.5s; }
    .node-3 { animation: floatNode 3.8s ease-in-out infinite 1s; }
    .title-text { font-family: system-ui, -apple-system, sans-serif; font-weight: 800; fill: url(#text-grad); }
    .subtitle-text { font-family: system-ui, -apple-system, sans-serif; font-weight: 500; fill: #94a3b8; }
    .badge-box { fill: #1e293b; stroke: #334155; stroke-width: 1.5; rx: 6; }
    .badge-txt { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; font-weight: 600; fill: #38bdf8; }
  </style>

  <!-- Background -->
  <rect width="1200" height="400" fill="url(#bg-grad)" rx="16"/>

  <!-- Circuit Grid Patterns -->
  <g stroke="#334155" stroke-width="1" opacity="0.4">
    <path d="M 0,100 L 1200,100 M 0,200 L 1200,200 M 0,300 L 1200,300" />
    <path d="M 200,0 L 200,400 M 400,0 L 400,400 M 600,0 L 600,400 M 800,0 L 800,400 M 1000,0 L 1000,400" />
  </g>

  <!-- Glowing Animated Data Traces -->
  <g stroke="#38bdf8" stroke-width="2" opacity="0.7" fill="none">
    <path class="trace-line" d="M 50,80 L 300,80 L 380,160 L 700,160" />
    <path class="trace-line" d="M 100,320 L 450,320 L 520,240 L 850,240" />
  </g>

  <!-- Silicon Wafer Graphic (Right side) -->
  <g transform="translate(0,0)">
    <circle cx="980" cy="200" r="160" fill="url(#wafer-glow)"/>
    <circle class="wafer-ring" cx="980" cy="200" r="140" fill="none" stroke="#38bdf8" stroke-width="2" filter="url(#glow)"/>
    <circle cx="980" cy="200" r="100" fill="none" stroke="#818cf8" stroke-width="1.5" stroke-dasharray="6 6"/>
    
    <!-- Wafer grid die lines -->
    <g class="wafer-grid" stroke="#06b6d4" stroke-width="1" opacity="0.6">
      <circle cx="980" cy="200" r="138" fill="none"/>
      <!-- Grid pattern inside wafer -->
      <path d="M 850,200 L 1110,200 M 980,70 L 980,330" />
      <path d="M 870,150 L 1090,150 M 870,250 L 1090,250" />
      <path d="M 930,90 L 930,310 M 1030,90 L 1030,310" />
      <path d="M 890,120 L 1070,120 M 890,280 L 1070,280" />
      <path d="M 950,80 L 950,320 M 1010,80 L 1010,320" />
      <!-- Notch at bottom -->
      <path d="M 975,338 L 985,338 L 980,333 Z" fill="#38bdf8"/>
    </g>
  </g>

  <!-- Floating Feature Nodes -->
  <g class="node-1" transform="translate(600, 70)">
    <rect class="badge-box" width="130" height="32"/>
    <text class="badge-txt" x="65" y="20" text-anchor="middle">⚡ SECS / GEM</text>
  </g>

  <g class="node-2" transform="translate(750, 140)">
    <rect class="badge-box" width="140" height="32"/>
    <text class="badge-txt" x="70" y="20" text-anchor="middle" fill="#c084fc">🏭 Wafer Tracking</text>
  </g>

  <g class="node-3" transform="translate(620, 270)">
    <rect class="badge-box" width="150" height="32"/>
    <text class="badge-txt" x="75" y="20" text-anchor="middle" fill="#34d399">📊 SPC &amp; Yield MES</text>
  </g>

  <!-- Title and Description -->
  <text class="title-text" x="70" y="140" font-size="42">Awesome Semiconductor</text>
  <text class="title-text" x="70" y="195" font-size="38">Manufacturing Execution System</text>
  
  <text class="subtitle-text" x="70" y="245" font-size="18">Curated Fab Automation, Lot/Wafer Tracking, Equipment Integration &amp; Yield Analytics</text>
  
  <!-- Badges in Banner -->
  <g transform="translate(70, 290)">
    <rect class="badge-box" width="110" height="34" rx="17" fill="#1e1b4b" stroke="#6366f1"/>
    <text class="badge-txt" x="55" y="21" text-anchor="middle" fill="#a5b4fc">💎 Enterprise</text>
    
    <rect class="badge-box" x="125" width="125" height="34" rx="17" fill="#064e3b" stroke="#10b981"/>
    <text class="badge-txt" x="187" y="21" text-anchor="middle" fill="#6ee7b7">🚀 Open Source</text>
    
    <rect class="badge-box" x="260" width="135" height="34" rx="17" fill="#311042" stroke="#d946ef"/>
    <text class="badge-txt" x="327" y="21" text-anchor="middle" fill="#f0abfc">⚙️ Industry 4.0</text>
  </g>
</svg>
